<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartão de Visita</title>

    <!-- Importação do arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cartão de visita -->
    <div class="card">

        <!-- Cabeçalho -->
        <div class="header">

            <!-- Foto de perfil feita com CSS -->
            <div class="profile-pic"></div>

        </div>

        <!-- Conteúdo do cartão -->
        <div class="content">

            <!-- Nome -->
            <h1 class="name">
                Raphael Silva Brito
            </h1>

            <!-- Cargo / profissão -->
            <div class="title">
                Estudante de Análise e Desenvolvimento de Sistemas
                <br>
                QA & Java
            </div>

            <!-- Habilidades -->
            <div class="skills">

                <span class="skill-tag">
                    Java
                </span>

                <span class="skill-tag">
                    JUnit
                </span>

                <span class="skill-tag">
                    QA Testing
                </span>

                <span class="skill-tag">
                    GitHub
                </span>

            </div>

            <!-- Informações de contato -->
            <div class="contact-info">

                <span>
                    seu.email@exemplo.com
                </span>

                <span>
                    (00) 00000-0000
                </span>

                <span>
                    linkedin.com/in/raphael-silva
                </span>

                <span>
                    Mato Grosso, Brasil
                </span>

            </div>

        </div>

    </div>

</body>

</html>
